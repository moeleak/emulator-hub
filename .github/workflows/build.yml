name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hub-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: windows-2022, target: x86_64-pc-windows-msvc }
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: macos-15, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxi-dev libxrandr-dev libgl1-mesa-dev libvulkan-dev protobuf-compiler
      - if: runner.os == 'macOS'
        run: brew install protobuf librsvg
      - if: runner.os == 'Windows'
        run: choco install protoc nsis -y --no-progress
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --workspace --target ${{ matrix.target }}
      - run: cargo build --locked --release -p emulator-hub --target ${{ matrix.target }}
      - name: Download verified AppImage packaging tool
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/appimagetool" https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  '"$RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          version="0.1.0-dev.${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          args=()
          if [[ "$RUNNER_OS" == Linux ]]; then args+=(--appimagetool "$RUNNER_TEMP/appimagetool"); fi
          python scripts/package.py --target "$TARGET" --version "$version" "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: emulator-hub-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check --no-build
      - run: nix build --print-build-logs
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, nix]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: emulator-hub-*
          path: dist
          merge-multiple: true
      - name: Publish preview after all four targets pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --prerelease --title "Emulator Hub $RELEASE_TAG" --generate-notes
